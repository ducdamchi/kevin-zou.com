<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo+Mono:ital,wght@0,100..900;1,100..900&family=Radio+Canada+Big:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <title>Kevin Zou</title>
    <script>
      ;(function () {
        try {
          var stored = window.localStorage.getItem('theme')
          var mode =
            stored === 'light' || stored === 'dark' || stored === 'auto'
              ? stored
              : 'auto'
          var prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches
          var resolved =
            mode === 'auto' ? (prefersDark ? 'dark' : 'light') : mode
          var root = document.documentElement
          root.classList.remove('light', 'dark')
          root.classList.add(resolved)
          if (mode === 'auto') {
            root.removeAttribute('data-theme')
          } else {
            root.setAttribute('data-theme', mode)
          }
          root.style.colorScheme = resolved
        } catch (e) {}
      })()
    </script>
  </head>
  <body
    class="font-sans antialiased [overflow-wrap:anywhere] selection:bg-[rgba(79,184,178,0.24)]"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
